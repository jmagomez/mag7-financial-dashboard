# Publica o front-end Vite (web/) no GitHub Pages (Settings > Pages > Source = GitHub Actions).
name: Publicar dashboard (Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "data.json", "fundamentals.json", "glossary.json", "history/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - name: Copiar dados para o artefato (o front lê estes JSON em tempo de execução)
        run: |
          mkdir -p web/dist/history
          cp data.json fundamentals.json glossary.json web/dist/
          cp history/snapshots.json web/dist/history/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
