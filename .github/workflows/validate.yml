name: Validar dados

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar data.json e snapshots
        run: python src/validate.py
      - name: Teste do e-mail (dry-run, sem envio)
        run: python src/send_email.py --dry-run
