name: Validar dados

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validar data.json e snapshots
        run: python src/validate.py
      - name: Teste do e-mail (dry-run, sem envio)
        run: python src/send_email.py --dry-run
