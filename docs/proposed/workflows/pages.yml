# PROPOSTA — publica o front-end Vite (web/) no GitHub Pages. Só entra em produção depois que a
# Fase 2 portar a UI; até lá o Pages continua servindo o index.html da raiz (Settings > Pages > "Deploy from a branch").
# Para ativar: Settings > Pages > Source = "GitHub Actions" e copiar este arquivo para .github/workflows/pages.yml.
name: Publicar dashboard (Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "data.json", "fundamentals.json", "glossary.json", "history/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - name: Copiar dados para o artefato (o front lê estes JSON em tempo de execução)
        run: |
          mkdir -p web/dist/history
          cp data.json fundamentals.json glossary.json web/dist/
          cp history/snapshots.json web/dist/history/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
